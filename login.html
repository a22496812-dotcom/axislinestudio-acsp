<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>登入 | 軸心線工作室</title>
  <meta name="description" content="登入或建立帳號以報名軸心線工作室課程" />
  <link rel="icon" type="image/png" href="./Logo/logo_64x64.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;500;700&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg:       #E8E2D4;
      --bg-light: #F2EDE3;
      --bg-dark:  #1E1C1A;
      --white:    #FDFAF5;
      --text:     #2B2825;
      --text-mid: #5A5550;
      --text-soft:#8C8680;
      --border:   #D0C9BC;
      --gold:     #B09A72;
      --green:    #4A9B6F;
      --red:      #C0544A;
      --radius:   8px;
      --tr:       0.2s ease;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Noto Sans TC', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    header {
      background: var(--bg-dark);
      padding: 0 32px;
      height: 60px;
      display: flex; align-items: center;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .logo-link { display: flex; align-items: center; gap: 10px; text-decoration: none; }
    .logo-link img { width: 32px; height: 32px; border-radius: 50%; }
    .logo-link span { font-family: 'Noto Serif TC', serif; font-size: 0.92rem; color: #fff; letter-spacing: 0.06em; }

    /* ── Auth Container ── */
    .auth-wrap {
      flex: 1;
      display: flex; align-items: center; justify-content: center;
      padding: 48px 24px;
    }
    .auth-box {
      background: var(--white);
      border-radius: 12px;
      border: 1px solid var(--border);
      padding: 40px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 8px 40px rgba(43,40,37,0.10);
    }
    .auth-logo {
      text-align: center; margin-bottom: 28px;
    }
    .auth-logo img { width: 52px; height: 52px; border-radius: 50%; }
    .auth-logo-name {
      font-family: 'Noto Serif TC', serif;
      font-size: 1.1rem; margin-top: 10px; font-weight: 400;
    }

    /* ── Tab Switch ── */
    .tab-bar {
      display: flex;
      border-bottom: 1px solid var(--border);
      margin-bottom: 28px;
    }
    .tab-btn {
      flex: 1; padding: 10px 0;
      font-family: 'Noto Sans TC', sans-serif;
      font-size: 0.88rem; color: var(--text-soft);
      background: none; border: none; cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: color var(--tr), border-color var(--tr);
      margin-bottom: -1px;
    }
    .tab-btn.active { color: var(--text); border-bottom-color: var(--gold); }

    /* ── Social Buttons ── */
    .social-btn {
      width: 100%; padding: 12px 16px;
      display: flex; align-items: center; gap: 12px;
      border: 1.5px solid var(--border);
      border-radius: 6px; background: var(--white);
      font-family: 'Noto Sans TC', sans-serif;
      font-size: 0.88rem; cursor: pointer;
      transition: border-color var(--tr), background var(--tr);
      margin-bottom: 10px;
    }
    .social-btn:hover { border-color: var(--gold); background: rgba(176,154,114,0.04); }
    .social-btn svg, .social-btn img { width: 20px; height: 20px; flex-shrink: 0; }

    .divider {
      display: flex; align-items: center; gap: 12px;
      margin: 20px 0;
      font-size: 0.75rem; color: var(--text-soft);
    }
    .divider::before, .divider::after {
      content: ''; flex: 1; height: 1px; background: var(--border);
    }

    /* ── Form ── */
    .field-group { margin-bottom: 16px; }
    .field-label { display: block; font-size: 0.8rem; font-weight: 500; color: var(--text-mid); margin-bottom: 6px; }
    .field-input {
      width: 100%; padding: 11px 14px;
      border: 1.5px solid var(--border); border-radius: 6px;
      font-size: 0.9rem; font-family: 'Noto Sans TC', sans-serif;
      background: var(--bg-light); color: var(--text);
      transition: border-color var(--tr), background var(--tr);
    }
    .field-input:focus { border-color: var(--gold); background: #fff; outline: none; }

    .btn-primary {
      width: 100%; padding: 13px;
      background: var(--gold); color: #fff;
      border: none; border-radius: 6px;
      font-family: 'Noto Sans TC', sans-serif;
      font-size: 0.95rem; font-weight: 500;
      cursor: pointer; transition: opacity var(--tr);
      margin-top: 8px;
    }
    .btn-primary:hover { opacity: 0.88; }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

    .msg {
      margin-top: 12px; padding: 10px 14px;
      border-radius: 6px; font-size: 0.83rem;
      display: none;
    }
    .msg.success { background: rgba(74,155,111,0.1); color: var(--green); border: 1px solid rgba(74,155,111,0.25); }
    .msg.error   { background: rgba(192,84,74,0.08); color: var(--red);   border: 1px solid rgba(192,84,74,0.2); }
    .msg.info    { background: rgba(176,154,114,0.1); color: var(--gold); border: 1px solid rgba(176,154,114,0.25); }

    /* ── Loading ── */
    #auth-loading {
      display: flex; align-items: center; justify-content: center;
      padding: 60px 0; flex-direction: column; gap: 12px;
      color: var(--text-soft); font-size: 0.88rem;
    }
    .spinner-sm {
      width: 28px; height: 28px;
      border: 2px solid var(--border);
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Already logged in ── */
    #logged-in-box { display: none; }
    .user-greeting {
      text-align: center; padding: 16px 0 24px;
      border-bottom: 1px solid var(--border); margin-bottom: 24px;
    }
    .user-avatar-lg {
      width: 52px; height: 52px; border-radius: 50%;
      background: var(--gold); color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.3rem; font-family: 'Noto Serif TC', serif;
      margin: 0 auto 12px;
    }
    .btn-outline-sm {
      padding: 8px 20px; border: 1.5px solid var(--border);
      border-radius: 6px; background: none; cursor: pointer;
      font-family: 'Noto Sans TC', sans-serif; font-size: 0.83rem;
      color: var(--text-mid); transition: border-color var(--tr);
    }
    .btn-outline-sm:hover { border-color: var(--text-mid); }
    .btn-gold-sm {
      padding: 8px 20px; border: none;
      background: var(--gold); color: #fff;
      border-radius: 6px; cursor: pointer;
      font-family: 'Noto Sans TC', sans-serif; font-size: 0.83rem;
      transition: opacity var(--tr);
    }
    .btn-gold-sm:hover { opacity: 0.88; }
    .btn-row { display: flex; gap: 10px; justify-content: center; }

    footer {
      background: var(--bg-dark); padding: 20px 32px;
      text-align: center; border-top: 1px solid rgba(255,255,255,0.06);
      font-size: 0.75rem; color: rgba(255,255,255,0.25);
    }
  </style>
</head>
<body>

<header>
  <a class="logo-link" href="index.html">
    <img src="./Logo/logo_64x64.png" alt="軸心線工作室" />
    <span>軸心線工作室</span>
  </a>
</header>

<div class="auth-wrap">
  <div class="auth-box">
    <div class="auth-logo">
      <img src="./Logo/logo_64x64.png" alt="Logo" />
      <div class="auth-logo-name">軸心線工作室</div>
    </div>

    <!-- Loading state -->
    <div id="auth-loading">
      <div class="spinner-sm"></div>
      <span>正在確認登入狀態…</span>
    </div>

    <!-- Logged-in state -->
    <div id="logged-in-box">
      <div class="user-greeting">
        <div class="user-avatar-lg" id="user-initial">A</div>
        <div style="font-size:0.92rem;font-weight:500;" id="user-name-display">—</div>
        <div style="font-size:0.78rem;color:var(--text-soft);margin-top:4px;" id="user-email-display">—</div>
      </div>
      <div class="btn-row">
        <button class="btn-outline-sm" onclick="doSignOut()">登出</button>
        <button class="btn-gold-sm" onclick="goBack()">繼續上課 →</button>
      </div>
    </div>

    <!-- Auth tabs -->
    <div id="auth-tabs" style="display:none;">
      <div class="tab-bar">
        <button class="tab-btn active" onclick="switchTab('login', this)">登入</button>
        <button class="tab-btn" onclick="switchTab('register', this)">註冊</button>
      </div>

      <!-- Social login -->
      <button class="social-btn" id="btn-google" onclick="signInGoogle()">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        使用 Google 帳號登入
      </button>

      <button class="social-btn" id="btn-line" onclick="signInLine()">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M19.365 9.863c.349 0 .63.285.63.631 0 .345-.281.63-.63.63H17.61v1.125h1.755c.349 0 .63.283.63.63 0 .344-.281.629-.63.629h-2.386c-.345 0-.627-.285-.627-.629V8.108c0-.345.282-.63.627-.63h2.386c.349 0 .63.285.63.63 0 .349-.281.63-.63.63H17.61v1.125h1.755zm-3.855 3.016c0 .27-.174.51-.432.596-.064.021-.133.031-.199.031-.211 0-.391-.09-.51-.25l-2.443-3.317v2.94c0 .344-.279.629-.631.629-.346 0-.626-.285-.626-.629V8.108c0-.27.173-.51.43-.595.06-.023.136-.033.194-.033.195 0 .375.105.495.254l2.462 3.33V8.108c0-.345.282-.63.63-.63.345 0 .63.285.63.63v4.771zm-5.741 0c0 .344-.282.629-.631.629-.345 0-.627-.285-.627-.629V8.108c0-.345.282-.63.627-.63.349 0 .631.285.631.63v4.771zm-2.466.629H4.917c-.345 0-.63-.285-.63-.629V8.108c0-.345.285-.63.63-.63.348 0 .63.285.63.63v4.141h1.756c.348 0 .629.283.629.63 0 .344-.281.629-.629.629M24 10.314C24 4.943 18.615.572 12 .572S0 4.943 0 10.314c0 4.811 4.27 8.842 10.035 9.608.391.082.923.258 1.058.59.12.301.079.766.038 1.08l-.164 1.02c-.045.301-.24 1.186 1.049.645 1.291-.539 6.916-4.078 9.436-6.975C23.176 14.393 24 12.458 24 10.314" fill="#06C755"/>
        </svg>
        使用 LINE 帳號登入
      </button>

      <div class="divider">或使用 Email</div>

      <!-- Login form -->
      <div id="form-login">
        <div class="field-group">
          <label class="field-label">Email</label>
          <input type="email" id="login-email" class="field-input" placeholder="your@email.com" />
        </div>
        <div class="field-group">
          <label class="field-label">密碼</label>
          <input type="password" id="login-password" class="field-input" placeholder="輸入密碼"
                 onkeydown="if(event.key==='Enter') doEmailLogin()" />
        </div>
        <button class="btn-primary" id="btn-email-login" onclick="doEmailLogin()">登入</button>
        <div class="msg" id="login-msg"></div>
      </div>

      <!-- Register form -->
      <div id="form-register" style="display:none;">
        <div class="field-group">
          <label class="field-label">姓名</label>
          <input type="text" id="reg-name" class="field-input" placeholder="你的名字" />
        </div>
        <div class="field-group">
          <label class="field-label">Email</label>
          <input type="email" id="reg-email" class="field-input" placeholder="your@email.com" />
        </div>
        <div class="field-group">
          <label class="field-label">密碼（至少 6 位）</label>
          <input type="password" id="reg-password" class="field-input" placeholder="設定密碼"
                 onkeydown="if(event.key==='Enter') doRegister()" />
        </div>
        <button class="btn-primary" id="btn-register" onclick="doRegister()">建立帳號</button>
        <div class="msg" id="reg-msg"></div>
      </div>
    </div>
  </div>
</div>

<footer>© 2026 軸心線工作室 All Rights Reserved.</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="supabase.js"></script>
<script>
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

  // ── Return URL ──
  function getReturnUrl() {
    const p = new URLSearchParams(location.search);
    return p.get('return') || 'index.html';
  }
  function goBack() {
    location.href = getReturnUrl();
  }

  // ── Tab switch ──
  function switchTab(tab, el) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    el.classList.add('active');
    document.getElementById('form-login').style.display    = tab === 'login'    ? '' : 'none';
    document.getElementById('form-register').style.display = tab === 'register' ? '' : 'none';
    clearMsgs();
  }
  function clearMsgs() {
    ['login-msg','reg-msg'].forEach(id => {
      const el = document.getElementById(id);
      el.style.display = 'none'; el.className = 'msg'; el.textContent = '';
    });
  }
  function showMsg(id, type, text) {
    const el = document.getElementById(id);
    el.textContent = text;
    el.className = 'msg ' + type;
    el.style.display = 'block';
  }

  // ── Init — check auth state ──
  async function initAuth() {
    const { data: { session } } = await sb.auth.getSession();
    document.getElementById('auth-loading').style.display = 'none';
    if (session && session.user) {
      showLoggedIn(session.user);
    } else {
      document.getElementById('auth-tabs').style.display = '';
    }
  }

  function showLoggedIn(user) {
    document.getElementById('auth-tabs').style.display = 'none';
    const box = document.getElementById('logged-in-box');
    box.style.display = '';
    const meta = user.user_metadata || {};
    const name = meta.full_name || meta.name || user.email.split('@')[0];
    document.getElementById('user-name-display').textContent = name;
    document.getElementById('user-email-display').textContent = user.email;
    document.getElementById('user-initial').textContent = name.charAt(0).toUpperCase();
  }

  // ── Google ──
  async function signInGoogle() {
    const { error } = await sb.auth.signInWithOAuth({
      provider: 'google',
      options: {
        redirectTo: location.origin + '/' + getReturnUrl(),
      }
    });
    if (error) alert('Google 登入失敗：' + error.message);
  }

  // ── LINE ──
  async function signInLine() {
    const { error } = await sb.auth.signInWithOAuth({
      provider: 'line',
      options: {
        redirectTo: location.origin + '/' + getReturnUrl(),
      }
    });
    if (error) alert('LINE 登入失敗：' + error.message);
  }

  // ── Email Login ──
  async function doEmailLogin() {
    const email = document.getElementById('login-email').value.trim();
    const password = document.getElementById('login-password').value;
    if (!email || !password) { showMsg('login-msg','error','請填寫 Email 和密碼'); return; }
    const btn = document.getElementById('btn-email-login');
    btn.disabled = true; btn.textContent = '登入中…';
    const { error } = await sb.auth.signInWithPassword({ email, password });
    btn.disabled = false; btn.textContent = '登入';
    if (error) {
      showMsg('login-msg','error', error.message.includes('Invalid') ? 'Email 或密碼錯誤' : error.message);
    } else {
      showMsg('login-msg','success','登入成功！即將跳轉…');
      setTimeout(goBack, 1000);
    }
  }

  // ── Email Register ──
  async function doRegister() {
    const name     = document.getElementById('reg-name').value.trim();
    const email    = document.getElementById('reg-email').value.trim();
    const password = document.getElementById('reg-password').value;
    if (!name)                       { showMsg('reg-msg','error','請輸入姓名'); return; }
    if (!email || !email.includes('@')){ showMsg('reg-msg','error','請輸入有效 Email'); return; }
    if (password.length < 6)         { showMsg('reg-msg','error','密碼至少需要 6 個字元'); return; }
    const btn = document.getElementById('btn-register');
    btn.disabled = true; btn.textContent = '建立中…';
    const { error } = await sb.auth.signUp({
      email, password,
      options: { data: { full_name: name } }
    });
    btn.disabled = false; btn.textContent = '建立帳號';
    if (error) {
      showMsg('reg-msg','error', error.message.includes('already') ? '此 Email 已有帳號，請直接登入' : error.message);
    } else {
      showMsg('reg-msg','success','帳號建立成功！請檢查信箱確認 Email，完成後即可登入。');
    }
  }

  // ── Sign out ──
  async function doSignOut() {
    await sb.auth.signOut();
    document.getElementById('logged-in-box').style.display = 'none';
    document.getElementById('auth-tabs').style.display = '';
  }

  // ── Handle OAuth redirect ──
  sb.auth.onAuthStateChange((event, session) => {
    if (event === 'SIGNED_IN' && session) {
      document.getElementById('auth-loading').style.display = 'none';
      document.getElementById('auth-tabs').style.display = 'none';
      showLoggedIn(session.user);
      // Auto-redirect after OAuth login
      setTimeout(goBack, 1200);
    }
  });

  initAuth();
</script>
</body>
</html>
