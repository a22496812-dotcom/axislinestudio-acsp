<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>登入 | 軸心線工作室</title>
  <meta name="description" content="登入或建立帳號以報名軸心線工作室課程" />
  <link rel="icon" type="image/png" href="./Logo/logo_64x64.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;500;700&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg:       #E8E2D4;
      --bg-light: #F2EDE3;
      --bg-dark:  #1E1C1A;
      --white:    #FDFAF5;
      --text:     #2B2825;
      --text-mid: #5A5550;
      --text-soft:#8C8680;
      --border:   #D0C9BC;
      --gold:     #B09A72;
      --green:    #4A9B6F;
      --red:      #C0544A;
      --radius:   8px;
      --tr:       0.2s ease;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Noto Sans TC', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    header {
      background: var(--bg-dark);
      padding: 0 32px;
      height: 60px;
      display: flex; align-items: center;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .logo-link { display: flex; align-items: center; gap: 10px; text-decoration: none; }
    .logo-link img { width: 32px; height: 32px; border-radius: 50%; }
    .logo-link span { font-family: 'Noto Serif TC', serif; font-size: 0.92rem; color: #fff; letter-spacing: 0.06em; }

    /* ── Auth Container ── */
    .auth-wrap {
      flex: 1;
      display: flex; align-items: center; justify-content: center;
      padding: 48px 24px;
    }
    .auth-box {
      background: var(--white);
      border-radius: 12px;
      border: 1px solid var(--border);
      padding: 40px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 8px 40px rgba(43,40,37,0.10);
    }
    .auth-logo {
      text-align: center; margin-bottom: 28px;
    }
    .auth-logo img { width: 52px; height: 52px; border-radius: 50%; }
    .auth-logo-name {
      font-family: 'Noto Serif TC', serif;
      font-size: 1.1rem; margin-top: 10px; font-weight: 400;
    }

    /* ── Tab Switch ── */
    .tab-bar {
      display: flex;
      border-bottom: 1px solid var(--border);
      margin-bottom: 28px;
    }
    .tab-btn {
      flex: 1; padding: 10px 0;
      font-family: 'Noto Sans TC', sans-serif;
      font-size: 0.88rem; color: var(--text-soft);
      background: none; border: none; cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: color var(--tr), border-color var(--tr);
      margin-bottom: -1px;
    }
    .tab-btn.active { color: var(--text); border-bottom-color: var(--gold); }

    /* ── Social Buttons ── */
    .social-btn {
      width: 100%; padding: 12px 16px;
      display: flex; align-items: center; gap: 12px;
      border: 1.5px solid var(--border);
      border-radius: 6px; background: var(--white);
      font-family: 'Noto Sans TC', sans-serif;
      font-size: 0.88rem; cursor: pointer;
      transition: border-color var(--tr), background var(--tr);
      margin-bottom: 10px;
    }
    .social-btn:hover { border-color: var(--gold); background: rgba(176,154,114,0.04); }
    .social-btn svg, .social-btn img { width: 20px; height: 20px; flex-shrink: 0; }

    .divider {
      display: flex; align-items: center; gap: 12px;
      margin: 20px 0;
      font-size: 0.75rem; color: var(--text-soft);
    }
    .divider::before, .divider::after {
      content: ''; flex: 1; height: 1px; background: var(--border);
    }

    /* ── Form ── */
    .field-group { margin-bottom: 16px; }
    .field-label { display: block; font-size: 0.8rem; font-weight: 500; color: var(--text-mid); margin-bottom: 6px; }
    .field-input {
      width: 100%; padding: 11px 14px;
      border: 1.5px solid var(--border); border-radius: 6px;
      font-size: 0.9rem; font-family: 'Noto Sans TC', sans-serif;
      background: var(--bg-light); color: var(--text);
      transition: border-color var(--tr), background var(--tr);
    }
    .field-input:focus { border-color: var(--gold); background: #fff; outline: none; }

    .btn-primary {
      width: 100%; padding: 13px;
      background: var(--gold); color: #fff;
      border: none; border-radius: 6px;
      font-family: 'Noto Sans TC', sans-serif;
      font-size: 0.95rem; font-weight: 500;
      cursor: pointer; transition: opacity var(--tr);
      margin-top: 8px;
    }
    .btn-primary:hover { opacity: 0.88; }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

    .msg {
      margin-top: 12px; padding: 10px 14px;
      border-radius: 6px; font-size: 0.83rem;
      display: none;
    }
    .msg.success { background: rgba(74,155,111,0.1); color: var(--green); border: 1px solid rgba(74,155,111,0.25); }
    .msg.error   { background: rgba(192,84,74,0.08); color: var(--red);   border: 1px solid rgba(192,84,74,0.2); }
    .msg.info    { background: rgba(176,154,114,0.1); color: var(--gold); border: 1px solid rgba(176,154,114,0.25); }

    /* ── Loading ── */
    #auth-loading {
      display: flex; align-items: center; justify-content: center;
      padding: 60px 0; flex-direction: column; gap: 12px;
      color: var(--text-soft); font-size: 0.88rem;
    }
    .spinner-sm {
      width: 28px; height: 28px;
      border: 2px solid var(--border);
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Already logged in ── */
    #logged-in-box { display: none; }
    .user-greeting {
      text-align: center; padding: 16px 0 24px;
      border-bottom: 1px solid var(--border); margin-bottom: 24px;
    }
    .user-avatar-lg {
      width: 52px; height: 52px; border-radius: 50%;
      background: var(--gold); color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.3rem; font-family: 'Noto Serif TC', serif;
      margin: 0 auto 12px;
    }
    .btn-outline-sm {
      padding: 8px 20px; border: 1.5px solid var(--border);
      border-radius: 6px; background: none; cursor: pointer;
      font-family: 'Noto Sans TC', sans-serif; font-size: 0.83rem;
      color: var(--text-mid); transition: border-color var(--tr);
    }
    .btn-outline-sm:hover { border-color: var(--text-mid); }
    .btn-gold-sm {
      padding: 8px 20px; border: none;
      background: var(--gold); color: #fff;
      border-radius: 6px; cursor: pointer;
      font-family: 'Noto Sans TC', sans-serif; font-size: 0.83rem;
      transition: opacity var(--tr);
    }
    .btn-gold-sm:hover { opacity: 0.88; }
    .btn-row { display: flex; gap: 10px; justify-content: center; }

    footer {
      background: var(--bg-dark); padding: 20px 32px;
      text-align: center; border-top: 1px solid rgba(255,255,255,0.06);
      font-size: 0.75rem; color: rgba(255,255,255,0.25);
    }
  </style>
</head>
<body>

<header>
  <a class="logo-link" href="index.html">
    <img src="./Logo/logo_64x64.png" alt="軸心線工作室" />
    <span>軸心線工作室</span>
  </a>
</header>

<div class="auth-wrap">
  <div class="auth-box">
    <div class="auth-logo">
      <img src="./Logo/logo_64x64.png" alt="Logo" />
      <div class="auth-logo-name">軸心線工作室</div>
    </div>

    <!-- Loading state -->
    <div id="auth-loading">
      <div class="spinner-sm"></div>
      <span>正在確認登入狀態…</span>
    </div>

    <!-- Logged-in state -->
    <div id="logged-in-box">
      <div class="user-greeting">
        <div class="user-avatar-lg" id="user-initial">A</div>
        <div style="font-size:0.92rem;font-weight:500;" id="user-name-display">—</div>
        <div style="font-size:0.78rem;color:var(--text-soft);margin-top:4px;" id="user-email-display">—</div>
      </div>
      <div class="btn-row">
        <button class="btn-outline-sm" onclick="doSignOut()">登出</button>
        <button class="btn-gold-sm" onclick="goBack()">繼續上課 →</button>
      </div>
    </div>

    <!-- Auth tabs -->
    <div id="auth-tabs" style="display:none;">
      <div class="tab-bar">
        <button class="tab-btn active" onclick="switchTab('login', this)">登入</button>
        <button class="tab-btn" onclick="switchTab('register', this)">註冊</button>
      </div>

      <!-- Login form -->
      <div id="form-login">
        <div class="field-group">
          <label class="field-label">Email</label>
          <input type="email" id="login-email" class="field-input" placeholder="your@email.com" autocomplete="email" />
        </div>
        <div class="field-group">
          <label class="field-label" style="display:flex;justify-content:space-between;align-items:center;">
            密碼
            <span style="font-weight:400;color:var(--gold);cursor:pointer;font-size:0.78rem;" onclick="showForgot()">忘記密碼？</span>
          </label>
          <input type="password" id="login-password" class="field-input" placeholder="輸入密碼"
                 autocomplete="current-password"
                 onkeydown="if(event.key==='Enter') doEmailLogin()" />
        </div>
        <button class="btn-primary" id="btn-email-login" onclick="doEmailLogin()">登入</button>
        <div class="msg" id="login-msg"></div>
      </div>

      <!-- Forgot password form -->
      <div id="form-forgot" style="display:none;">
        <p style="font-size:0.85rem;color:var(--text-mid);margin-bottom:16px;line-height:1.6;">
          輸入你的 Email，我們會寄送重設密碼的連結給你。
        </p>
        <div class="field-group">
          <label class="field-label">Email</label>
          <input type="email" id="forgot-email" class="field-input" placeholder="your@email.com"
                 onkeydown="if(event.key==='Enter') doForgot()" />
        </div>
        <button class="btn-primary" id="btn-forgot" onclick="doForgot()">寄送重設連結</button>
        <div class="msg" id="forgot-msg"></div>
        <div style="text-align:center;margin-top:14px;">
          <span style="font-size:0.82rem;color:var(--gold);cursor:pointer;" onclick="hideForgot()">← 返回登入</span>
        </div>
      </div>

      <!-- Register form -->
      <div id="form-register" style="display:none;">
        <div class="field-group">
          <label class="field-label">姓名</label>
          <input type="text" id="reg-name" class="field-input" placeholder="你的名字" autocomplete="name" />
        </div>
        <div class="field-group">
          <label class="field-label">Email</label>
          <input type="email" id="reg-email" class="field-input" placeholder="your@email.com" autocomplete="email" />
        </div>
        <div class="field-group">
          <label class="field-label">密碼（至少 6 位）</label>
          <input type="password" id="reg-password" class="field-input" placeholder="設定密碼"
                 autocomplete="new-password"
                 onkeydown="if(event.key==='Enter') doRegister()" />
        </div>
        <button class="btn-primary" id="btn-register" onclick="doRegister()">建立帳號</button>
        <div class="msg" id="reg-msg"></div>
      </div>
    </div>
  </div>
</div>

<footer>© 2026 軸心線工作室 All Rights Reserved.</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="supabase.js"></script>
<script>
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

  // ── Return URL ──
  function getReturnUrl() {
    const p = new URLSearchParams(location.search);
    return p.get('return') || 'index.html';
  }
  function goBack() {
    location.href = getReturnUrl();
  }

  // ── Tab switch ──
  function switchTab(tab, el) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    el.classList.add('active');
    document.getElementById('form-login').style.display    = tab === 'login'    ? '' : 'none';
    document.getElementById('form-register').style.display = tab === 'register' ? '' : 'none';
    document.getElementById('form-forgot').style.display   = 'none';
    clearMsgs();
  }
  function clearMsgs() {
    ['login-msg','reg-msg','forgot-msg'].forEach(id => {
      const el = document.getElementById(id);
      if (el) { el.style.display = 'none'; el.className = 'msg'; el.textContent = ''; }
    });
  }
  function showMsg(id, type, text) {
    const el = document.getElementById(id);
    el.textContent = text;
    el.className = 'msg ' + type;
    el.style.display = 'block';
  }

  // ── Forgot password ──
  function showForgot() {
    const email = document.getElementById('login-email').value.trim();
    document.getElementById('form-login').style.display  = 'none';
    document.getElementById('form-forgot').style.display = '';
    if (email) document.getElementById('forgot-email').value = email;
    clearMsgs();
  }
  function hideForgot() {
    document.getElementById('form-forgot').style.display = 'none';
    document.getElementById('form-login').style.display  = '';
    clearMsgs();
  }
  async function doForgot() {
    const email = document.getElementById('forgot-email').value.trim();
    if (!email || !email.includes('@')) { showMsg('forgot-msg','error','請輸入有效 Email'); return; }
    const btn = document.getElementById('btn-forgot');
    btn.disabled = true; btn.textContent = '寄送中…';
    const { error } = await sb.auth.resetPasswordForEmail(email, {
      redirectTo: location.origin + '/login.html'
    });
    btn.disabled = false; btn.textContent = '寄送重設連結';
    if (error) {
      showMsg('forgot-msg','error','寄送失敗，請確認 Email 是否正確');
    } else {
      showMsg('forgot-msg','success','✅ 重設連結已寄出！請檢查你的信箱（含垃圾郵件）');
    }
  }

  // ── Init — check auth state ──
  async function initAuth() {
    const { data: { session } } = await sb.auth.getSession();
    document.getElementById('auth-loading').style.display = 'none';
    if (session && session.user) {
      showLoggedIn(session.user);
    } else {
      document.getElementById('auth-tabs').style.display = '';
    }
  }

  function showLoggedIn(user) {
    document.getElementById('auth-tabs').style.display = 'none';
    const box = document.getElementById('logged-in-box');
    box.style.display = '';
    const meta = user.user_metadata || {};
    const name = meta.full_name || meta.name || user.email.split('@')[0];
    document.getElementById('user-name-display').textContent = name;
    document.getElementById('user-email-display').textContent = user.email;
    document.getElementById('user-initial').textContent = name.charAt(0).toUpperCase();
  }

  // ── Email Login ──
  async function doEmailLogin() {
    const email = document.getElementById('login-email').value.trim();
    const password = document.getElementById('login-password').value;
    if (!email || !password) { showMsg('login-msg','error','請填寫 Email 和密碼'); return; }
    const btn = document.getElementById('btn-email-login');
    btn.disabled = true; btn.textContent = '登入中…';
    const { error } = await sb.auth.signInWithPassword({ email, password });
    btn.disabled = false; btn.textContent = '登入';
    if (error) {
      showMsg('login-msg','error', error.message.includes('Invalid') ? 'Email 或密碼錯誤' : error.message);
    } else {
      showMsg('login-msg','success','登入成功！即將跳轉…');
      setTimeout(goBack, 1000);
    }
  }

  // ── Email Register ──
  async function doRegister() {
    const name     = document.getElementById('reg-name').value.trim();
    const email    = document.getElementById('reg-email').value.trim();
    const password = document.getElementById('reg-password').value;
    if (!name)                       { showMsg('reg-msg','error','請輸入姓名'); return; }
    if (!email || !email.includes('@')){ showMsg('reg-msg','error','請輸入有效 Email'); return; }
    if (password.length < 6)         { showMsg('reg-msg','error','密碼至少需要 6 個字元'); return; }
    const btn = document.getElementById('btn-register');
    btn.disabled = true; btn.textContent = '建立中…';
    const { error } = await sb.auth.signUp({
      email, password,
      options: { data: { full_name: name } }
    });
    btn.disabled = false; btn.textContent = '建立帳號';
    if (error) {
      showMsg('reg-msg','error', error.message.includes('already') ? '此 Email 已有帳號，請直接登入' : error.message);
    } else {
      // 註冊成功 → 自動切換到登入頁並帶入 Email
      showMsg('reg-msg','success','✅ 帳號建立成功！請前往信箱點擊驗證連結，完成後再回來登入。');
      const registeredEmail = email;
      setTimeout(() => {
        // 切換到登入 tab
        const loginTab = document.querySelector('.tab-btn');
        switchTab('login', loginTab);
        // 帶入 Email
        document.getElementById('login-email').value = registeredEmail;
        document.getElementById('login-password').focus();
        showMsg('login-msg','info','📧 請先到信箱確認驗證信，完成後輸入密碼登入');
      }, 2000);
    }
  }

  // ── Sign out ──
  async function doSignOut() {
    await sb.auth.signOut();
    document.getElementById('logged-in-box').style.display = 'none';
    document.getElementById('auth-tabs').style.display = '';
  }

  // ── Handle OAuth redirect ──
  sb.auth.onAuthStateChange((event, session) => {
    if (event === 'SIGNED_IN' && session) {
      document.getElementById('auth-loading').style.display = 'none';
      document.getElementById('auth-tabs').style.display = 'none';
      showLoggedIn(session.user);
      // Auto-redirect after OAuth login
      setTimeout(goBack, 1200);
    }
  });

  initAuth();
</script>
</body>
</html>
